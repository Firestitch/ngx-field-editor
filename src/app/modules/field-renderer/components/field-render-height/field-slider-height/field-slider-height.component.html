<div class="fs-form-message">
  <div class="fs-form-hint">
    @if (hint) {
      {{ hint }}
    }
  </div>
</div>
<div
    class="header"
    [class.centered]="!showUnitToggle">
  @if (label) {
    <div class="label fs-form-label">
      {{ label }}
    </div>
  }
  <div class="value">
    <span class="value__number">
      {{ displayValue.number }}
    </span>
    @if (displayValue.unit) {
      <span class="value__unit">
        {{ displayValue.unit }}
      </span>
    }
  </div>
  @if (showUnitToggle) {
    <mat-button-toggle-group
        class="unit-toggle"
        [value]="unit"
        (change)="unitChange($event.value)"
        [disabled]="disabled"
        aria-label="Height unit">
      <mat-button-toggle value="in">
        in
      </mat-button-toggle>
      <mat-button-toggle value="cm">
        cm
      </mat-button-toggle>
    </mat-button-toggle-group>
  }
</div>
<mat-slider
    class="slider"
    [min]="sliderMin"
    [max]="sliderMax"
    [step]="1"
    [discrete]="false"
    [disabled]="disabled">
  <input
    matSliderThumb
    [value]="thumbValue"
    (input)="sliderInput($any($event.target).value)">
</mat-slider>
<div class="bounds">
  <span class="min">
    {{ displayMin }}
  </span>
  <span class="max">
    {{ displayMax }}
  </span>
</div>
