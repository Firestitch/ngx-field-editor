<div class="fs-form-message">
  <div class="fs-form-hint">
    @if (hint) { {{ hint }} }
  </div>
</div>
@if (label) {
  <div class="fs-form-label">{{ label }}</div>
}
<div class="height-row">
  @if (unit === 'in') {
    <mat-form-field class="form-field-padless narrow">
      <input
        matInput
        type="number"
        inputmode="numeric"
        min="0"
        step="1"
        [(ngModel)]="feet"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="feetInchesChange()"
        [disabled]="disabled">
      <span matTextSuffix>ft</span>
    </mat-form-field>
    <mat-form-field class="form-field-padless narrow">
      <input
        matInput
        type="number"
        inputmode="numeric"
        min="0"
        max="11"
        step="1"
        [(ngModel)]="inches"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="feetInchesChange()"
        [disabled]="disabled">
      <span matTextSuffix>in</span>
    </mat-form-field>
  } @else {
    <mat-form-field class="form-field-padless narrow">
      <input
        matInput
        type="number"
        inputmode="numeric"
        min="0"
        step="1"
        [(ngModel)]="cm"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="cmChange()"
        [disabled]="disabled">
      <span matTextSuffix>cm</span>
    </mat-form-field>
  }
  @if (showUnitToggle) {
    <mat-button-toggle-group
      class="unit-toggle"
      [value]="unit"
      (change)="unitChange($event.value)"
      [disabled]="disabled"
      aria-label="Height unit">
      <mat-button-toggle value="in">in</mat-button-toggle>
      <mat-button-toggle value="cm">cm</mat-button-toggle>
    </mat-button-toggle-group>
  }
</div>
